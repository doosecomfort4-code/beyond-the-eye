
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05030a">
<title>Beyond the Eye</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #05030a;
  font-family: Georgia, serif;
}

#experience {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: #05030a;
  color: white;
}

.scene {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  visibility: hidden;
  transition: opacity 1.2s ease, visibility 1.2s;
}

.scene.active {
  opacity: 1;
  visibility: visible;
}

/* EYE */

#eyeScene {
  background: radial-gradient(ellipse, #201326, #08050d 65%, #000);
}

.eye-wrap {
  position: relative;
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.eye-svg {
  width: 100%;
  height: 100%;
  position: absolute;
  inset: 0;
}

.eye-shape {
  fill: url(#sclera);
  stroke: #8e667f;
  stroke-width: 3;
}

.iris {
  transform-origin: 500px 300px;
  animation: irisGlow 3s ease-in-out infinite alternate;
}

@keyframes irisGlow {
  from { filter: brightness(.85); }
  to { filter: brightness(1.25); }
}

.lid-top, .lid-bottom {
  fill: url(#skin);
  stroke: #76506d;
  stroke-width: 3;
}

.lid-top {
  transform: translateY(0);
  animation: openTop 3.5s cubic-bezier(.2,.8,.2,1) 1s forwards;
}

.lid-bottom {
  transform: translateY(0);
  animation: openBottom 3.5s cubic-bezier(.2,.8,.2,1) 1s forwards;
}

@keyframes openTop {
  to { transform: translateY(-330px); }
}

@keyframes openBottom {
  to { transform: translateY(330px); }
}

.heart-button {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%) scale(.2);
  border: 0;
  background: transparent;
  color: #ff91d2;
  font-size: clamp(40px, 9vw, 85px);
  text-shadow: 0 0 12px #ff4fbd, 0 0 35px #f000a6;
  cursor: pointer;
  opacity: 0;
  animation: heartAppear 1.5s ease 4.8s forwards,
             heartBeat 1.5s ease-in-out 6.3s infinite;
  z-index: 5;
}

@keyframes heartAppear {
  to { opacity: 1; transform: translate(-50%,-50%) scale(1); }
}

@keyframes heartBeat {
  0%,100% { scale: 1; }
  15% { scale: 1.17; }
  30% { scale: 1; }
  45% { scale: 1.1; }
}

/* LETTER */

#letterScene {
  background:
    radial-gradient(ellipse at center, #321b39, #0b0710 70%, #000);
  padding: 25px;
}

.letter {
  width: min(90vw, 430px);
  padding: 35px 28px;
  border: 1px solid rgba(255,185,231,.5);
  border-radius: 5px;
  background: linear-gradient(145deg, #fff2fa, #e8cde5);
  color: #482943;
  text-align: center;
  box-shadow: 0 0 60px rgba(239,110,205,.25);
  animation: letterIn 1.2s ease both;
}

@keyframes letterIn {
  from { opacity: 0; transform: translateY(35px) scale(.85); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.letter h2 {
  font-size: 30px;
  font-weight: normal;
  margin-bottom: 22px;
}

.letter p {
  font-family: Georgia, serif;
  font-size: 16px;
  line-height: 1.8;
  margin-bottom: 25px;
}

.action {
  border: 1px solid #a75b94;
  border-radius: 30px;
  background: #542b50;
  color: white;
  padding: 13px 25px;
  letter-spacing: 2px;
  cursor: pointer;
}

/* GARDEN */

#gardenScene {
  background: linear-gradient(
    to bottom,
    #17132e 0%,
    #4c3569 35%,
    #b4779a 67%,
    #172b2c 100%
  );
}

#garden {
  position: absolute;
  inset: 0;
  overflow: hidden;
}

.moon {
  position: absolute;
  width: 95px;
  height: 95px;
  border-radius: 50%;
  top: 12%;
  right: 15%;
  background: #ffe6d9;
  box-shadow: 0 0 35px #ffd6ec, 0 0 100px #e9a9e1;
}

.hill {
  position: absolute;
  width: 150%;
  height: 45%;
  left: -25%;
  bottom: -18%;
  border-radius: 50% 50% 0 0;
  background: linear-gradient(#345a45, #102a25);
}

.hill.second {
  width: 130%;
  height: 30%;
  left: -15%;
  bottom: -12%;
  background: linear-gradient(#52784e, #183528);
}

.garden-title {
  position: absolute;
  top: 9%;
  left: 0;
  width: 100%;
  text-align: center;
  font-size: clamp(28px, 6vw, 44px);
  font-weight: normal;
  color: #fff2f5;
  text-shadow: 0 0 20px #f3b3df;
  letter-spacing: 2px;
}

.flower {
  position: absolute;
  bottom: 12%;
  font-size: clamp(35px, 7vw, 65px);
  transform-origin: bottom center;
  animation: sway 3s ease-in-out infinite alternate;
  filter: drop-shadow(0 0 12px rgba(255,190,240,.5));
}

@keyframes sway {
  from { transform: rotate(-8deg); }
  to { transform: rotate(8deg); }
}

.butterfly {
  position: absolute;
  font-size: 27px;
  animation: fly 9s linear infinite;
  filter: drop-shadow(0 0 8px #ffc9ed);
}

@keyframes fly {
  0% { transform: translate(-10vw, 20vh) rotate(0); }
  25% { transform: translate(25vw, -8vh) rotate(20deg); }
  50% { transform: translate(60vw, 15vh) rotate(-15deg); }
  75% { transform: translate(90vw, -15vh) rotate(15deg); }
  100% { transform: translate(120vw, 10vh) rotate(0); }
}

.firefly {
  position: absolute;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #fff6bd;
  box-shadow: 0 0 10px 4px #f6dca0;
  animation: flicker 2s ease-in-out infinite alternate;
}

@keyframes flicker {
  from { opacity: .1; transform: scale(.6); }
  to { opacity: 1; transform: scale(1.6); }
}

.garden-note {
  position: absolute;
  bottom: 6%;
  width: 100%;
  text-align: center;
  color: #fff2e9;
  font-size: 15px;
  letter-spacing: 2px;
  text-shadow: 0 2px 12px #000;
}

/* SOUND CONTROL */

#sound {
  position: absolute;
  z-index: 20;
  top: 18px;
  right: 18px;
  border: 1px solid rgba(255,255,255,.4);
  background: rgba(0,0,0,.3);
  color: white;
  border-radius: 30px;
  padding: 9px 13px;
  font-size: 12px;
  cursor: pointer;
}
</style>
</head>

<body>
<div id="experience">

  <button id="sound">♫ SOUND ON</button>

  <!-- EYE SCENE -->
  <section class="scene active" id="eyeScene">
    <div class="eye-wrap">

      <svg class="eye-svg" viewBox="0 0 1000 600"
           preserveAspectRatio="xMidYMid meet">

        <defs>
          <radialGradient id="sclera">
            <stop offset="0%" stop-color="#fff"/>
            <stop offset="75%" stop-color="#eadde9"/>
            <stop offset="100%" stop-color="#9c8196"/>
          </radialGradient>

          <radialGradient id="skin">
            <stop offset="0%" stop-color="#8b607e"/>
            <stop offset="100%" stop-color="#120914"/>
          </radialGradient>

          <radialGradient id="irisColor">
            <stop offset="0%" stop-color="#18091b"/>
            <stop offset="35%" stop-color="#a94b96"/>
            <stop offset="65%" stop-color="#ed9acb"/>
            <stop offset="100%" stop-color="#54214f"/>
          </radialGradient>

          <clipPath id="eyeClip">
            <path d="M45 300 Q500 -10 955 300 Q500 610 45 300Z"/>
          </clipPath>
        </defs>

        <g clip-path="url(#eyeClip)">
          <path class="eye-shape"
            d="M45 300 Q500 -10 955 300 Q500 610 45 300Z"/>

          <g class="iris">
            <circle cx="500" cy="300" r="185" fill="url(#irisColor)"/>
            <circle cx="500" cy="300" r="150"
              fill="none" stroke="#f5b5df" stroke-width="8" opacity=".6"/>
            <circle cx="500" cy="300" r="125"
              fill="none" stroke="#fce1f2" stroke-width="3" opacity=".7"/>

            <g stroke="#f8c2e8" stroke-width="5" opacity=".55">
              <path d="M500 115V175 M500 425V485
                       M315 300H375 M625 300H685
                       M370 170L415 215 M585 385L630 430
                       M630 170L585 215 M415 385L370 430"/>
            </g>

            <circle cx="500" cy="300" r="90" fill="#08030b"/>
            <circle cx="500" cy="300" r="78"
              fill="none" stroke="#9b347d" stroke-width="5"/>
            <circle cx="475" cy="270" r="15" fill="#fff" opacity=".75"/>
          </g>

          <path d="M45 300 Q500 -10 955 300"
            fill="none" stroke="#76506d" stroke-width="9"/>
          <path d="M45 300 Q500 610 955 300"
            fill="none" stroke="#76506d" stroke-width="9"/>
        </g>

        <!-- Closed eyelids that open -->
        <path class="lid-top"
          d="M0 0H1000V300 Q500 -10 0 300Z"/>
        <path class="lid-bottom"
          d="M0 600H1000V300 Q500 610 0 300Z"/>

      </svg>

      <button class="heart-button" id="heartButton"
              aria-label="Open the heart">♥</button>
    </div>
  </section>

  <!-- LETTER SCENE -->
  <section class="scene" id="letterScene">
    <div class="letter">
      <h2>A little something...</h2>
      <p>
        Somewhere beyond everything we can see,
        there is a beautiful little world waiting
        to be discovered.
        <br><br>
        And this is only the beginning.
      </p>
      <button class="action" id="letterButton">
        AWAKEN THE GARDEN
      </button>
    </div>
  </section>

  <!-- GARDEN SCENE -->
  <section class="scene" id="gardenScene">
    <div id="garden">
      <div class="moon"></div>
      <h1 class="garden-title">A World Beyond</h1>
      <div class="hill"></div>
      <div class="hill second"></div>
      <div class="garden-note">A little world of wonder</div>
    </div>
  </section>

</div>

<script>
const scenes = {
  eye: document.getElementById("eyeScene"),
  letter: document.getElementById("letterScene"),
  garden: document.getElementById("gardenScene")
};

function showScene(name) {
  Object.values(scenes).forEach(scene => {
    scene.classList.remove("active");
  });
  scenes[name].classList.add("active");
}

/* SOUND: original synthesized atmosphere */
let audio;
let soundEnabled = false;

function startMusic() {
  if (audio) return;

  const AudioContext = window.AudioContext || window.webkitAudioContext;
  if (!AudioContext) return;

  audio = new AudioContext();

  const master = audio.createGain();
  master.gain.value = 0.08;
  master.connect(audio.destination);

  const notes = [55, 82.4, 110, 164.8];

  notes.forEach((frequency, index) => {
    const oscillator = audio.createOscillator();
    const volume = audio.createGain();

    oscillator.type = "sine";
    oscillator.frequency.value = frequency;
    volume.gain.value = index === 0 ? .7 : .2;

    oscillator.connect(volume);
    volume.connect(master);
    oscillator.start();
  });

  const pulse = audio.createOscillator();
  const pulseGain = audio.createGain();

  pulse.type = "triangle";
  pulse.frequency.value = 1.4;
  pulseGain.gain.value = 12;

  pulse.connect(pulseGain);
  pulse.start();
}

document.getElementById("sound").addEventListener("click", async () => {
  startMusic();

  if (!audio) return;

  await audio.resume();
  soundEnabled = !soundEnabled;

  const master = audio.destination;
  document.getElementById("sound").textContent =
    soundEnabled ? "♫ SOUND ON" : "♫ SOUND OFF";

  audio.suspend();
  if (soundEnabled) audio.resume();
});

/* HEART OPENS THE LETTER */
document.getElementById("heartButton").addEventListener("click", () => {
  startMusic();
  showScene("letter");
});

/* LETTER AWAKENS THE GARDEN */
document.getElementById("letterButton").addEventListener("click", () => {
  showScene("garden");
  createGarden();
});

/* GARDEN DETAILS */
function createGarden() {
  const garden = document.getElementById("garden");

  if (garden.dataset.created) return;
  garden.dataset.created = "true";

  const flowers = ["🌸", "🌷", "🌺", "🌼", "🪻", "🌹"];

  for (let i = 0; i < 22; i++) {
    const flower = document.createElement("div");
    flower.className = "flower";
    flower.textContent = flowers[i % flowers.length];
    flower.style.left = (i * 4.8 + Math.random() * 2) + "%";
    flower.style.bottom = (8 + Math.random() * 12) + "%";
    flower.style.animationDelay = (Math.random() * 3) + "s";
    garden.appendChild(flower);
  }

  for (let i = 0; i < 5; i++) {
    const butterfly = document.createElement("div");
    butterfly.className = "butterfly";
    butterfly.textContent = "🦋";
    butterfly.style.top = (15 + Math.random() * 55) + "%";
    butterfly.style.animationDelay = (i * -2) + "s";
    garden.appendChild(butterfly);
  }

  for (let i = 0; i < 45; i++) {
    const light = document.createElement("div");
    light.className = "firefly";
    light.style.left = Math.random() * 100 + "%";
    light.style.top = Math.random() * 85 + "%";
    light.style.animationDelay = Math.random() * 3 + "s";
    garden.appendChild(light);
  }
}
</script>

</body>
</html>
