
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05020b">
<title>Beyond the Eye</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #05020b;
  color: white;
  overflow: hidden;
  font-family: Georgia, serif;
}

canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
}

.overlay {
  position: fixed;
  inset: 0;
  background: radial-gradient(
    ellipse,
    transparent 20%,
    rgba(0,0,0,.7) 100%
  );
  pointer-events: none;
}

.intro {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  padding: 35px 20px 65px;
  text-align: center;
  transition: opacity 1s;
}

.intro.hide {
  opacity: 0;
  pointer-events: none;
}

.small {
  font: 10px Arial;
  letter-spacing: 6px;
  color: #d8a4ff;
  margin-bottom: 18px;
}

h1 {
  font-size: clamp(38px, 10vw, 65px);
  font-weight: normal;
  letter-spacing: 2px;
  text-shadow: 0 0 30px #b45cff;
  margin-bottom: 15px;
}

.description {
  color: #c7b5d8;
  font: 13px/1.8 Arial;
  max-width: 310px;
  margin-bottom: 27px;
}

button {
  background: linear-gradient(120deg,#6b268d,#26103b);
  color: white;
  border: 1px solid #dba7ff;
  border-radius: 40px;
  padding: 15px 30px;
  letter-spacing: 3px;
  font-size: 10px;
  cursor: pointer;
  box-shadow: 0 0 25px #a63cff55;
}

.replay {
  position: fixed;
  top: 25px;
  right: 20px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 1s;
}

.replay.show {
  opacity: 1;
  pointer-events: auto;
}

.caption {
  position: fixed;
  top: 35px;
  width: 100%;
  text-align: center;
  font: 10px Arial;
  letter-spacing: 5px;
  color: #e3b8ff;
  opacity: 0;
  transition: opacity 1s;
}

.caption.show {
  opacity: 1;
}

</style>
</head>

<body>

<canvas id="universe"></canvas>
<div class="overlay"></div>

<div class="caption" id="caption">
  WELCOME TO THE OTHER SIDE
</div>

<div class="intro" id="intro">
  <div class="small">A JOURNEY BEYOND REALITY</div>

  <h1>Beyond the Eye</h1>

  <p class="description">
    Somewhere between a blink and a dream,
    another universe is waiting for you.
  </p>

  <button id="start">
    AWAKEN THE EYE
  </button>
</div>

<button class="replay" id="replay">
  ↻ REPLAY
</button>

<script>

const canvas = document.getElementById("universe");
const ctx = canvas.getContext("2d");

const intro = document.getElementById("intro");
const startButton = document.getElementById("start");
const replayButton = document.getElementById("replay");
const caption = document.getElementById("caption");

let W, H, DPR;
let mode = "idle";
let phaseStart = 0;
let stars = [];
let particles = [];
let eyeCharacters = [];

const characters = " .,:;+=*xX#%@";

function resize() {

  DPR = Math.min(window.devicePixelRatio || 1, 2);

  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width = W * DPR;
  canvas.height = H * DPR;

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  createStars();
  createParticles();
}

window.addEventListener("resize", resize);

function createStars() {

  stars = [];

  for (let i = 0; i < 220; i++) {

    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      size: Math.random() * 1.7 + .3,
      alpha: Math.random() * .7 + .2,
      speed: Math.random() * 3 + 1
    });

  }

}

function createParticles() {

  particles = [];

  for (let i = 0; i < 450; i++) {

    particles.push({

      angle: Math.random() * Math.PI * 2,

      distance: Math.random() * Math.max(W,H) * .8,

      size: Math.random() * 2 + .3,

      speed: (Math.random() * .0002 + .00004) *
        (Math.random() > .5 ? 1 : -1),

      color: Math.random() > .5 ? 290 : 325

    });

  }

}

function makeEyeCharacters() {

  eyeCharacters = [];

  const step = Math.max(5, W / 115);

  for (let y = -180; y <= 180; y += step) {

    for (let x = -350; x <= 350; x += step) {

      const nx = x / 330;
      const ny = y / 145;

      const inside =
        nx * nx + ny * ny < 1;

      if (!inside) continue;

      const pupil =
        (x / 100) ** 2 + (y / 85) ** 2 < .65;

      const iris =
        (x / 145) ** 2 + (y / 110) ** 2 < 1;

      eyeCharacters.push({

        x,
        y,
        pupil,
        iris,
        char: characters[
          Math.floor(Math.random() * characters.length)
        ]

      });

    }

  }

}

function drawBackground() {

  ctx.fillStyle = "#05020b";
  ctx.fillRect(0, 0, W, H);

  const gradient = ctx.createRadialGradient(
    W/2, H/2, 5,
    W/2, H/2, Math.max(W,H)*.7
  );

  gradient.addColorStop(0, "#21102f");
  gradient.addColorStop(.5, "#0d0718");
  gradient.addColorStop(1, "#020107");

  ctx.fillStyle = gradient;
  ctx.fillRect(0,0,W,H);

}

function drawEye(time, opening, zoom) {

  drawBackground();

  const cx = W/2;
  const cy = H*.42;

  const scale = Math.min(W/700, 1);

  const eyeScale = scale * zoom;

  ctx.save();

  ctx.translate(cx,cy);
  ctx.scale(eyeScale,eyeScale);

  const cell = 8;

  ctx.font = "8px monospace";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  for (const item of eyeCharacters) {

    const x = item.x;
    const y = item.y;

    const boundary =
      .42 * Math.sqrt(
        Math.max(0,1-(x/330)**2)
      );

    if (Math.abs(y/145) > boundary * opening) {
      continue;
    }

    let color = "#aaa0b7";
    let char = item.char;

    if (item.iris) {

      color = "#d38cff";
      char = characters[
        Math.floor((time/100 + x + y + 200) % characters.length)
      ];

    }

    if (item.pupil) {

      color = "#08050d";
      char = " ";

    }

    const shimmer =
      .6 + .4 * Math.sin(time*.003 + x*.03 + y*.02);

    ctx.globalAlpha = shimmer;
    ctx.fillStyle = color;

    ctx.fillText(char,x,y);

  }

  ctx.globalAlpha = 1;

  // Glowing iris

  const glow = ctx.createRadialGradient(
    0,0,5,
    0,0,120
  );

  glow.addColorStop(0,"#d77aff33");
  glow.addColorStop(1,"#b44aff00");

  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(0,0,120,0,Math.PI*2);
  ctx.fill();

  ctx.restore();

}

function drawGalaxy(time, reveal) {

  drawBackground();

  const cx = W/2;
  const cy = H/2;

  // Background stars

  for (const star of stars) {

    const twinkle =
      .4 + .6 * Math.sin(time*.001*star.speed);

    ctx.globalAlpha = star.alpha * twinkle * reveal;

    ctx.fillStyle = "#ffffff";

    ctx.beginPath();

    ctx.arc(
      star.x,
      star.y,
      star.size,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

  ctx.globalAlpha = 1;

  // Cosmic particles

  ctx.save();

  ctx.translate(cx,cy);
  ctx.rotate(time*.00003);

  for (const p of particles) {

    const angle = p.angle + time*p.speed;

    const distance = p.distance * reveal;

    const x = Math.cos(angle) * distance;
    const y = Math.sin(angle) * distance * .6;

    ctx.globalAlpha = .7 * reveal;

    ctx.fillStyle = `hsl(${p.color},90%,78%)`;

    ctx.beginPath();

    ctx.arc(x,y,p.size,0,Math.PI*2);

    ctx.fill();

  }

  ctx.restore();

  ctx.globalAlpha = 1;

  // Glowing atmosphere

  const atmosphere = ctx.createRadialGradient(
    cx,cy,10,
    cx,cy,Math.min(W,H)*.48
  );

  atmosphere.addColorStop(0,"#ff8ddd66");
  atmosphere.addColorStop(.35,"#9c46d455");
  atmosphere.addColorStop(1,"#5c24aa00");

  ctx.fillStyle = atmosphere;

  ctx.beginPath();
  ctx.arc(cx,cy,Math.min(W,H)*.48,0,Math.PI*2);
  ctx.fill();

  // The mysterious planet

  const radius = Math.min(W,H)*.105;

  const planet = ctx.createRadialGradient(
    cx-radius*.4,
    cy-radius*.45,
    2,
    cx,
    cy,
    radius
  );

  planet.addColorStop(0,"#ffe6f9");
  planet.addColorStop(.25,"#ff9bd9");
  planet.addColorStop(.65,"#a44bce");
  planet.addColorStop(1,"#241037");

  ctx.fillStyle = planet;

  ctx.beginPath();

  ctx.arc(cx,cy,radius,0,Math.PI*2);

  ctx.fill();

  // Planet ring

  ctx.strokeStyle = "#f8c6ff99";
  ctx.lineWidth = 1.5;

  ctx.beginPath();

  ctx.ellipse(
    cx,cy,
    radius*1.9,
    radius*.55,
    -.25,
    0,
    Math.PI*2
  );

  ctx.stroke();

  ctx.globalAlpha = 1;

}

function animate(time) {

  if (!phaseStart) phaseStart = time;

  const elapsed = time - phaseStart;

  if (mode === "idle") {

    drawEye(
      time,
      .85 + .1*Math.sin(time*.001),
      1
    );

  }

  else if (mode === "opening") {

    const p = Math.min(elapsed/2200,1);

    const ease = 1-Math.pow(1-p,3);

    drawEye(
      time,
      .05 + ease*.95,
      1
    );

    if (p >= 1) {

      mode = "zoom";
      phaseStart = time;

    }

  }

  else if (mode === "zoom") {

    const p = Math.min(elapsed/1800,1);

    const ease = p*p;

    drawEye(
      time,
      1,
      1 + ease*4
    );

    ctx.fillStyle =
      `rgba(0,0,0,${Math.max(0,(p-.5)*2)})`;

    ctx.fillRect(0,0,W,H);

    if (p >= 1) {

      mode = "reveal";
      phaseStart = time;

      caption.classList.add("show");

    }

  }

  else if (mode === "reveal") {

    const p = Math.min(elapsed/2500,1);

    drawGalaxy(time,p);

    if (p >= 1) {

      mode = "galaxy";
      phaseStart = time;

      replayButton.classList.add("show");

    }

  }

  else if (mode === "galaxy") {

    drawGalaxy(time,1);

  }

  requestAnimationFrame(animate);

}

function awaken() {

  intro.classList.add("hide");

  replayButton.classList.remove("show");
  caption.classList.remove("show");

  mode = "opening";
  phaseStart = 0;

}

function reset() {

  mode = "idle";
  phaseStart = 0;

  intro.classList.remove("hide");

  replayButton.classList.remove("show");
  caption.classList.remove("show");

}

startButton.addEventListener("click",awaken);

replayButton.addEventListener("click",reset);

resize();
makeEyeCharacters();

requestAnimationFrame(animate);

</script>

</body>
</html>
