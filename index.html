
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beyond the Eye</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #020106;
  font-family: Georgia, serif;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
}

#world {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at center, #17101e 0%, #05030a 55%, #000 100%);
  overflow: hidden;
}

#eyeStage {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transform: scale(1);
  transform-origin: center;
  transition: transform 5s cubic-bezier(.7,0,.2,1);
}

#eyeStage.expand {
  transform: scale(5.5);
}

.eye {
  position: relative;
  width: min(94vw, 1100px);
  height: min(55vw, 480px);
  min-height: 220px;
  overflow: hidden;
  filter: drop-shadow(0 0 35px rgba(180,80,180,.22));
}

.eye-white {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at 50% 50%, #fff 0%, #d9cbd0 48%, #806b7a 80%, #21131f 100%);
  clip-path: ellipse(50% 50% at 50% 50%);
  overflow: hidden;
}

.veins {
  position: absolute;
  inset: 0;
  opacity: .25;
  background:
    radial-gradient(ellipse at 15% 45%, transparent 35%, #a54b62 36%, transparent 37%),
    radial-gradient(ellipse at 85% 55%, transparent 35%, #a54b62 36%, transparent 37%);
}

.iris {
  position: absolute;
  width: 37%;
  aspect-ratio: 1;
  border-radius: 50%;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  background:
    repeating-conic-gradient(
      from 0deg,
      #f6a1cc 0deg,
      #64264e 5deg,
      #e3a0c7 9deg,
      #35152e 14deg
    );
  box-shadow:
    inset 0 0 30px #160b22,
    0 0 25px #d35aaf,
    0 0 65px rgba(217,91,190,.55);
  overflow: hidden;
}

.iris::before {
  content: "";
  position: absolute;
  inset: 12%;
  border-radius: 50%;
  border: 2px solid rgba(255,220,246,.55);
  box-shadow: 0 0 20px #ff9ee8;
}

.pupil {
  position: absolute;
  width: 48%;
  height: 48%;
  border-radius: 50%;
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%);
  background: radial-gradient(circle, #000 35%, #100514 70%, #43133d);
  box-shadow: 0 0 25px #ed72cb;
  display: flex;
  align-items: center;
  justify-content: center;
}

.heart {
  font-family: Arial, sans-serif;
  font-size: clamp(22px, 5vw, 55px);
  color: #ffb0df;
  text-shadow:
    0 0 8px #ff4fc5,
    0 0 22px #ff38bc,
    0 0 45px #ff1493;
  animation: heartbeat 1.1s infinite;
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  15% { transform: scale(1.18); }
  30% { transform: scale(1); }
  45% { transform: scale(1.12); }
}

.glint {
  position: absolute;
  width: 18%;
  height: 8%;
  top: 24%;
  left: 25%;
  background: rgba(255,255,255,.85);
  filter: blur(9px);
  border-radius: 50%;
  transform: rotate(-35deg);
}

.lid {
  position: absolute;
  z-index: 5;
  left: -5%;
  width: 110%;
  height: 56%;
  background:
    linear-gradient(180deg, #08050a 0%, #21101e 55%, #63324f 100%);
  transition: transform 4s cubic-bezier(.7,0,.2,1);
}

.top-lid {
  top: -3%;
  border-radius: 0 0 50% 50%;
  box-shadow: 0 15px 35px rgba(0,0,0,.9);
  transform: translateY(0);
}

.bottom-lid {
  bottom: -3%;
  border-radius: 50% 50% 0 0;
  background: linear-gradient(0deg, #08050a 0%, #21101e 55%, #63324f 100%);
  box-shadow: 0 -15px 35px rgba(0,0,0,.9);
  transform: translateY(0);
}

.open .top-lid {
  transform: translateY(-100%);
}

.open .bottom-lid {
  transform: translateY(100%);
}

#start {
  position: absolute;
  z-index: 10;
  bottom: 9%;
  left: 50%;
  transform: translateX(-50%);
  border: 1px solid rgba(255,180,230,.5);
  background: rgba(15,5,18,.8);
  color: #f6c4e7;
  padding: 15px 32px;
  font-size: 12px;
  letter-spacing: 5px;
  text-transform: uppercase;
  cursor: pointer;
  transition: .3s;
}

#start:hover {
  background: #421b3b;
  box-shadow: 0 0 25px #b94e9c;
}

#start.hide {
  opacity: 0;
  pointer-events: none;
}

#shade {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 7;
  background: radial-gradient(ellipse, transparent 35%, rgba(0,0,0,.8) 100%);
  transition: opacity 4s;
}

#shade.fade {
  opacity: 0;
}

@media(max-width:600px) {
  .eye {
    width: 100vw;
    height: 60vw;
  }
}
</style>
</head>

<body>
<div id="world">

  <div id="eyeStage">
    <div class="eye" id="eye">

      <div class="eye-white">
        <div class="veins"></div>

        <div class="iris">
          <div class="glint"></div>
          <div class="pupil">
            <span class="heart">♥</span>
          </div>
        </div>
      </div>

      <div class="lid top-lid"></div>
      <div class="lid bottom-lid"></div>

    </div>
  </div>

  <div id="shade"></div>

  <button id="start">Open the eye</button>

</div>

<script>
const eye = document.getElementById("eye");
const stage = document.getElementById("eyeStage");
const button = document.getElementById("start");
const shade = document.getElementById("shade");

let audioContext;

function startSound() {
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  if (!AudioContext) return;

  audioContext = new AudioContext();

  const master = audioContext.createGain();
  master.gain.value = 0.16;
  master.connect(audioContext.destination);

  // Deep atmospheric bass
  const bass = audioContext.createOscillator();
  const bassGain = audioContext.createGain();

  bass.type = "sawtooth";
  bass.frequency.setValueAtTime(48, audioContext.currentTime);
  bassGain.gain.value = 0.35;

  bass.connect(bassGain);
  bassGain.connect(master);
  bass.start();

  // Dark electronic pulse
  const pulse = audioContext.createOscillator();
  const pulseGain = audioContext.createGain();

  pulse.type = "triangle";
  pulse.frequency.value = 65;
  pulseGain.gain.value = 0.12;

  pulse.connect(pulseGain);
  pulseGain.connect(master);
  pulse.start();

  // Rising sound
  const rise = audioContext.createOscillator();
  const riseGain = audioContext.createGain();

  rise.type = "sine";
  rise.frequency.setValueAtTime(80, audioContext.currentTime);
  rise.frequency.exponentialRampToValueAtTime(
    420,
    audioContext.currentTime + 8
  );

  riseGain.gain.setValueAtTime(0.001, audioContext.currentTime);
  riseGain.gain.linearRampToValueAtTime(
    0.15,
    audioContext.currentTime + 7
  );

  rise.connect(riseGain);
  riseGain.connect(master);
  rise.start();

  // Slow rhythmic bass movement
  const lfo = audioContext.createOscillator();
  const lfoGain = audioContext.createGain();

  lfo.frequency.value = 1.2;
  lfoGain.gain.value = 15;

  lfo.connect(lfoGain);
  lfoGain.connect(bass.frequency);
  lfo.start();
}

button.addEventListener("click", async () => {
  button.classList.add("hide");

  startSound();

  if (audioContext && audioContext.state === "suspended") {
    await audioContext.resume();
  }

  eye.classList.add("open");

  setTimeout(() => {
    shade.classList.add("fade");
  }, 1800);

  setTimeout(() => {
    stage.classList.add("expand");
  }, 4000);
});
</script>
</body>
</html>
